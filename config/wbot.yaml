# W-BOT machine configuration (v2). Units: mm, deg, s, us.
# Board coordinates: origin = lower-left of the drawing area, X right, Y up.
version: 2

board:
  width_mm: 1500
  height_mm: 1000
  margin_mm: 10
  # Nutzbare Zeichenflaeche (siehe wbot/workspace.py): Motoren sitzen nur 41 mm ueber der Tafel und die Riemen
  # greifen an der Gondel V2 176 mm UEBER dem Stift an: bei y = 1041 - 176 = 865 liegt der Angriffspunkt auf Hoehe
  # der Scheibenmitte (Riemen waagerecht, Fehlerverstaerkung -> unendlich, Riemenkraft negativ). Darum endet die
  # Zeichenflaeche bei y = 750 (Verstaerkung <= 3,9); in den unteren Ecken traegt der ferne Riemen nur ~0,3 N.
  margin_left_mm: 120
  margin_right_mm: 120
  margin_bottom_mm: 10
  margin_top_mm: 250

geometry:
  anchor_left: [47, 1041]             # Motoren oben am Whiteboard-Rahmen (41 mm ueber der Tafel)
  anchor_right: [1453, 1041]
  pulley_pitch_radius_mm: 12.732      # GT2 40T: 40 * 2 mm / (2*pi)
  model: tangent                      # tangent = accurate, naive = no pre-distortion
  # Gondel V2 (starrer Koerper an zwei Riemen, kippt in die statische Gleichgewichtslage, wbot/gondola.py):
  attach_half_spacing_mm: 8           # Riemenangriff x = -8 (links) / +8 (rechts) zur Stiftachse
  attach_height_mm: 176               # ... und 176 mm ueber der Stiftspitze
  com_height_mm: 33.8                 # Schwerpunkt ueber der Stiftspitze (Fusion-Modell, nicht gewogen)
  com_offset_x_mm: 1.2                # Schwerpunkt rechts der Stiftachse (Fusion-Modell)
  gondola_tilt: true                  # false = Angriffspunkte starr zum Stift (keine Drehung)
  gondola_mass_kg: 0.404              # nur fuer die Statik (workspace.py); 0.345 .. 0.465 je nach Fuellung
  pen_offset_mm: [0, 0]               # kleine Kalibrierkorrektur des Angriffsvektors; [0,0] = exakt nominal
  belt_scale_left: 1.0
  belt_scale_right: 1.0

drive:
  motor_steps_per_rev: 200
  microsteps: 16
  pulley_teeth: 40
  belt_pitch_mm: 2.0                  # -> steps_per_mm = 40
  invert_left: false
  invert_right: false

firmware:
  segment_length_mm: 1.0
  max_rate_mm_min: 3000
  boot_position: [0, 0]
  # Hier muss der Stift beim Einschalten haengen (FluidNC-Nullpunkt). Firmware-Anker = Anker - boot_physical.
  # [0, 0] = untere linke Ecke = aktive Board-Config. Anderer Wert -> FluidNC-Config neu erzeugen und hochladen.
  boot_physical: [0, 0]

motion:
  travel_feed_mm_min: 3000
  draw_feed_mm_min: 1500
  jog_feed_mm_min: 3000
  acceleration_mm_s2: 250
  junction_deviation_mm: 0.05
  park_position: [750, 700]
  predistort_tolerance_mm: 0.02
  max_chord_mm: 25
  min_chord_mm: 0.5

servos:
  pen:                                # Servo B, Z axis, gpio.4, +-44 deg (bewiesenes Fenster 1256..1744 us; mehr erst nach Freigabe)
    axis: Z
    pin: gpio.4                       # SCL am I2C-Header (IO22/Probe verschleift das Signal)
    center_us: 1500
    us_per_deg: 5.555556                # MG90S: 1000..2000 us == 180 deg
    min_deg: -44
    max_deg: 44
    axis_min: -44
    axis_travel: 88
    up_deg: 44                        # Gondel V2: Hub nutzt das ganze 88-Grad-Fenster
    down_deg: -44
    settle_s: 0.30
    speed_deg_s: 500
  revolver:                           # Servo A, A axis, IO32, 3 colours
    axis: A
    pin: gpio.32
    enabled: true
    center_us: 1500
    us_per_deg: 5.555556
    min_deg: -66                      # Gondel V2: Revolver-Fenster +-66 deg (1134..1866 us)
    max_deg: 66
    axis_min: 0                       # Achse 0 = -66 deg (Boot-Position liegt im Fenster)
    axis_travel: 132
    slots_deg: [-60, 0, 60]
    settle_s: 0.30
    speed_deg_s: 500

colors:
  - { name: schwarz, hex: "#111111" }
  - { name: rot, hex: "#d32f2f" }
  - { name: blau, hex: "#1565c0" }

connection:
  transport: sim                      # sim | serial | wifi   (serial/wifi only with explicit connect)
  serial: { port: COM3, baudrate: 115200, rx_buffer_bytes: 127 }
  wifi: { host: fluidnc.local, port: null, protocol: telnet }   # port null = 23 (telnet) / 81 (websocket); NO authentication
  status_poll_hz: 10

api:
  host: 127.0.0.1
  port: 8000

# KI-Steuerung per MCP (wbot/mcp_server.py) - wird bei jedem Tool-Aufruf neu gelesen
mcp:
  enabled: true                       # false: /mcp antwortet 503, der stdio-Server bietet nur emergency_stop
  allow_motion: true                  # false = nur Vorschau/Status, nichts bewegt sich (Not-Schalter)
  max_strokes: 2000
  max_points: 200000
  require_confirm_real_hardware: false   # true: Zeichnen auf echter Hardware nur mit confirm=true
